  <script>
    let map;
    const marker = new google.maps.Marker({
          position: { lat: 43, lng: 7 },
          map: map,
          title: 'Point',
      });
    let markers = [marker];
    var data = {{data}}
    var flightPlanCoordinates = []
    data.forEach(function(pair) {
        var latLng = {lat : pair[0], lng : pair[1]};
        flightPlanCoordinates.push(latLng)
      });
    
    var zoom = 8;
    var lat = 45;
    var lng = 0;
    function center(i,j){
        var data = {{data}};
        const appear = data.slice(i,j)
        var lat_min= 100;
        var lng_min = 100;
        var lat_max = 0;
       var lng_max = 0;
        appear.forEach(function(pair){
          lat_min = Math.min(lat_min,pair[0]);
          lng_min = Math.min(lng_min,pair[1]);
          lat_max = Math.max(lat_max,pair[0]);
          lng_max = Math.max(lng_max,pair[1]);
        });
        lat = (lat_min+lat_max)/2;
        lng = (lng_min+lng_max)/2;
        const win = window.innerWidth;
        max_dist = Math.max((lat - lat_min)/400, (lng - lng_min)/(win*0.8));
        zoom = Math.log(156543.03392 * Math.cos(lat * Math.PI / 180) / (max_dist*100000))*1.25;

    }



    function draw(i,j){
      center(i,j)
      console.log(i)
        map = new google.maps.Map(document.getElementById("map"), {
        zoom: zoom,
        center: { lat: lat, lng: lng },
        mapTypeId: "terrain",
      });

      const flightPath = new google.maps.Polyline({
        path: flightPlanCoordinates.slice(i,j),
        geodesic: true,
        strokeColor: "#FF0000",
        strokeOpacity: 1.0,
        strokeWeight: 3,
      });

      flightPath.setMap(map);
    }

    function addMarker(lat, lng) {
      markers[0].setMap(null);
      const marker = new google.maps.Marker({
          position: { lat: lat, lng: lng },
          map: map,
          title: 'Point',
      });

      markers = [marker];

    }

    function initMap() {
    draw({{start}},{{end}})
  }
  function update(i,j){
    console.log(i)
    draw(i,j)
  }

  <script>
  function calculate() {

    var parameters = {{parameters}};
    var crr = parseFloat(document.getElementById("crrInput").value);
    var weight = parseFloat(document.getElementById("weightInput").value);
    var efficiency = parseFloat(document.getElementById("drivetrainInput").value);
    parameters.push(crr);
    parameters.push(weight);
    parameters.push(efficiency);
    start = {{start}}
    end = {{end}};
    var url = "/calculate?start=" + start + "&end=" + end + "&data=" + parameters;
    var popupWindow = window.open(url, 'PopupWindow', 'width=600,height=400');
    popupWindow.focus();
  }
</script>
